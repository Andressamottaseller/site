<style>
:root{--ink:#0B0B0F;--gold:#C8A24A;--gold-2:#D9BA6B;--gold-dark:#9C7C30;--text:#2A1E1A;--muted:#6f6258;--bg:#F6F0E8;--card:#fff;--line:#E7D7C6;--green:#1fa855;--red:#a8322a;--safira:#0F2A5F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff}
.hbar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.logo img{width:44px;height:44px;border-radius:50%;background:#000;border:1px solid var(--gold-dark)}
.logo b{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-2);letter-spacing:.5px}
.voltar{color:#fff;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.voltar:hover{color:var(--gold-2)}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:'Playfair Display',serif;font-size:30px;line-height:1.2;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1px solid #cfc2b3;border-radius:10px;font:inherit;font-size:16px;background:#fff;color:inherit}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ink);color:var(--gold-2);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{color:var(--red);font-size:14px;font-weight:600;margin-top:12px;min-height:1px}
.ajuda{font-size:13px;color:var(--muted);margin-top:14px}
a.lnk{color:var(--safira);font-weight:600}
.resumo{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.resumo h2{font-size:18px}.resumo .tot{color:var(--muted);font-size:14px}
.ptop{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ptop b{font-size:16px}.ptop span{color:var(--muted);font-size:13px}
.selo{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#FBF3DF;color:#7a5e1c;margin-bottom:16px}
.selo.ok{background:#E2F5EA;color:#14703a}.selo.x{background:#F8E5E3;color:var(--red)}
ol.tl{list-style:none;display:flex;margin-bottom:6px}
ol.tl li{flex:1;position:relative;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding:26px 4px 0}
ol.tl li::before{content:"";position:absolute;top:4px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:2px solid #cfc2b3;z-index:1}
ol.tl li::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#cfc2b3}
ol.tl li:first-child::after{display:none}
ol.tl li.f{color:var(--text)}ol.tl li.f::before{background:var(--gold);border-color:var(--gold)}ol.tl li.f::after{background:var(--gold)}
ol.tl li.a{color:var(--text);font-weight:800}ol.tl li.a::before{box-shadow:0 0 0 4px #F1E3BD}
.info{font-size:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.info p+p{margin-top:4px}
.prazo{font-size:13px;color:var(--muted)}
.prazo b{color:var(--text)}
.sair{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--safira);cursor:pointer;text-decoration:underline}
@media (max-width:480px){h1{font-size:26px}ol.tl li{font-size:10.5px;padding-left:2px;padding-right:2px}.card{padding:16px}}
</style>
</head>

<main>
  <h1>Meus pedidos</h1>
  <p class="sub">Acompanhe seus pedidos e o andamento de cada um na Sirius.</p>

  <form class="card" id="f" autocomplete="on">
    <label>CNPJ ou CPF<input id="doc" inputmode="numeric" autocomplete="username" placeholder="Somente os números ou com pontuação" required></label>
    <label>Código de acesso<input id="cod" type="password" autocomplete="current-password" placeholder="Código enviado pela Sirius" required></label>
    <button class="btn" id="b">Ver meus pedidos</button>
    <p class="msg" id="m" role="alert"></p>
    <p class="ajuda">Ainda não tem seu código? <a class="lnk" target="_blank" rel="noopener" href="https://wa.me/5545999547991?text=Ol%C3%A1!%20Quero%20meu%20c%C3%B3digo%20de%20acesso%20para%20acompanhar%20meus%20pedidos.">Peça pelo WhatsApp</a>.</p>
  </form>

  <section id="r" hidden></section>
</main>
<script>
const E=["aguardando_pagamento","pagamento_confirmado","em_separacao","enviado_transportadora"];
const NOME={aguardando_pagamento:"Aguardando pagamento",pagamento_confirmado:"Pagamento confirmado",em_separacao:"Em separação",enviado_transportadora:"Enviado à transportadora",cancelado:"Cancelado"};
const CURTO=["Aguardando pagamento","Pagamento confirmado","Em separação","Na transportadora"];
const PRAZO="Após a finalização do pedido, o envio à transportadora ocorre em até <b>48 horas</b>. Em períodos de alta demanda, pode levar até <b>3 dias</b>. Catástrofes climáticas podem alterar esse prazo.";
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?`${m[3]}/${m[2]}/${m[1]}`:esc(s)};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dk(seg,sal,bits){const te=new TextEncoder();const k=await crypto.subtle.importKey("raw",te.encode(seg),"PBKDF2",false,["deriveBits"]);return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:te.encode(sal),iterations:200000},k,bits)}
function card(p){
  const i=E.indexOf(p.status),canc=p.status==="cancelado";
  const tl=canc?"":`<ol class="tl">${CURTO.map((t,k)=>`<li class="${k<=i?"f":""} ${k===i?"a":""}">${t}</li>`).join("")}</ol>`;
  const inf=[];
  if(p.previsao)inf.push(`<p><b>Previsão de envio:</b> ${dt(p.previsao)}</p>`);
  if(p.transportadora)inf.push(`<p><b>Transportadora:</b> ${esc(p.transportadora)}</p>`);
  if(p.rastreio)inf.push(`<p><b>Rastreio:</b> ${esc(p.rastreio)}</p>`);
  if(p.obs)inf.push(`<p>${esc(p.obs)}</p>`);
  if(!canc&&p.status!=="enviado_transportadora")inf.push(`<p class="prazo">${PRAZO}</p>`);
  const cl=p.status==="enviado_transportadora"?"ok":canc?"x":"";
  return `<article class="card"><div class="ptop"><b>Pedido nº ${esc(p.n)}</b><span>${dt(p.data)}</span></div><span class="selo ${cl}">${esc(NOME[p.status]||p.status)}</span>${tl}${inf.length?`<div class="info">${inf.join("")}</div>`:""}</article>`;
}
function mostra(d){
  const L=(d.pedidos||[]).slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  const q=L.length;
  $("r").innerHTML=`<div class="resumo"><div><h2>${esc(d.cliente||"Seus pedidos")}</h2><span class="tot">${q===1?"1 pedido realizado":q+" pedidos realizados"}</span></div><button class="sair" id="s">Sair</button></div>`+(q?L.map(card).join(""):`<div class="card">Nenhum pedido registrado ainda.</div>`)+(d.atualizado?`<p class="ajuda">Atualizado em ${dt(d.atualizado)}.</p>`:"");
  $("f").hidden=true;$("r").hidden=false;
  $("s").onclick=()=>{$("r").hidden=true;$("r").innerHTML="";$("cod").value="";$("f").hidden=false};
}
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();$("m").textContent="";
  const doc=$("doc").value.replace(/\D/g,""),cod=$("cod").value.trim().toUpperCase();
  if(doc.length!==14&&doc.length!==11){$("m").textContent="Confira o CNPJ ou CPF informado.";return}
  $("b").disabled=true;$("b").textContent="Consultando…";
  try{
    const seg=doc+"|"+cod,id=hex(await dk(seg,"sirius-pedidos-id",128));
    const r=await fetch("d/"+id+".json?x="+Date.now(),{cache:"no-store"});
    if(r.status===404){$("m").textContent="CNPJ/CPF ou código incorretos.";return}
    if(!r.ok)throw 0;
